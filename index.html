<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenir la charge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Tenir la charge</h1>
    <div class="tabs" id="tabs"><button class="tab" data-m="missions">Missions</button><button class="tab" data-m="camp">Croissance</button><button class="tab" data-m="daily">Défi</button></div>
  </header>
  <div id="top"></div>
  <div class="card">
    <h2><b id="title"></b><span id="crumb"></span></h2>
    <p class="story" id="story"></p>
    <div class="goals" id="goals"></div>
  </div>
  <div class="tools" id="tools"></div>
  <canvas id="board"></canvas>
  <p class="hint" id="hint"></p>
</div>
<footer>
  <div class="cards" id="cards"></div>
  <div class="bar">
    <div class="cost" id="costBox"><div class="k" id="costK">Coût mensuel</div><div class="v" id="cost">0 €</div></div>
    <button class="btn light small" id="speed" style="display:none">×2</button>
    <button class="btn go" id="run">Lancer ▶</button>
  </div>
</footer>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" inert></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" inert></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
